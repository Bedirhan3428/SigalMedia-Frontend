# Local Supabase stack (supabase CLI). Production settings live in the dashboard.
project_id = "shovrum"

[api]
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 100

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
skip_nonce_check = false

[realtime]
enabled = true

# Media is NOT in Supabase Storage: it lives in Cloudflare R2 (see docs/SUPABASE_PLAN.md).
[storage]
enabled = false

[functions.send-push]
verify_jwt = false      # called by Database Webhooks with a shared secret header
[functions.r2-reaper]
verify_jwt = false      # cron-invoked with a shared secret
